name: Apply Voice Controls v2 and build APK

on:
  push:
    paths:
      - '.github/workflows/voice-controls-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

