name: Apply T3 prefill memory fix and build APK

on:
  push:
    paths:
      - '.github/workflows/apply-prefill-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Apply T3 memory fix
